name: Deploy to GitHub Pages

# Bio Dynamx Music is a static app with no build step: the www/ folder is the
# deployable artefact. This workflow publishes it to Pages on every push so the
# HTTPS URL (which the microphone requires) always matches main.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload the web app
        uses: actions/upload-pages-artifact@v3
        with:
          path: www

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
